<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>FamCal Listen hell und dunkel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<template>
  <div class="sub">Einkauf · 4 Dinge</div>
  <h1 class="h1">Listen<b>.</b></h1>
  <div style="display:flex;gap:18px;margin:16px 0 18px;border-bottom:1px solid var(--hair);padding-bottom:10px">
    <span style="display:flex;flex-direction:column;align-items:center;gap:4px" class="m"><img src="../../assets/icons/icon-erledigt.webp" alt="" style="width:44px;height:44px">Aufgaben</span>
    <span style="display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);font-weight:600;font-size:13px"><img src="../../assets/icons/icon-einkauf.webp" alt="" style="width:52px;height:52px">Einkauf</span>
    <span style="display:flex;flex-direction:column;align-items:center;gap:4px" class="m"><img src="../../assets/icons/icon-notizblock.webp" alt="" style="width:44px;height:44px">Filme</span>
  </div>
  <div style="display:flex;justify-content:space-between;margin:0 4px 10px"><span class="t" style="font-weight:600">Supermarkt</span><span class="m">3</span></div>
  <div class="group">
    <div class="rowi"><span class="check"></span><span class="t" style="flex:1">Karotten<br><span class="m">500 g</span></span><span class="who none"></span></div>
    <div class="rowi" style="background:var(--doneSoft)"><span class="check"></span><span class="t" style="flex:1">Mehl<br><span class="m" style="color:var(--done)">gerade ergänzt</span></span><span class="who j">J</span></div>
    <div class="rowi"><span class="check"></span><span class="t" style="flex:1">2 Hafermilch</span><span class="who none"></span></div>
    <div class="rowi"><span class="check on"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="t" style="flex:1;color:var(--mute);text-decoration:line-through">Zucker</span><span class="who t">T</span></div>
  </div>
  <div class="dock"><div class="field"><span class="plus">+</span><span class="ph">Was kommt auf die Liste?</span><span class="mic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--onMain)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span></div></div>
  <div class="tabs"><span>Kalender</span><span class="on">Listen</span><span>Eingang</span></div>
</template>
<script src="_frame.js"></script>
</body>
</html>
