<style>
/* Layout: zentrierte Headline über einem Bogen aus fünf Telefonen. Beim Scrollen fliegen die äußeren weg, das mittlere bleibt stehen, links und rechts kommen graue Textkarten, und im Telefon schieben sich die Screens übereinander. Danach eine dunkle Warteliste. */
:root {
  --bg: #FFFFFF;
  --card: #F2F2F0;
  --surface: #FFFFFF;
  --screen: #F5F5F4;
  --ink: #16232A;

  --chip: #EFEFEC;
  --glass: rgba(242, 242, 240, .72);
  --dark: #0E1518; --on-dark: #F1F3F3; --on-dark-sub: #9BA6AA;

  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease-enter: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-move: cubic-bezier(0.77, 0, 0.175, 1);
}
/* Hell ist Standard, Dunkel nur über den Umschalter oben */
:root[data-mode="dark"] {
  --bg: #0F1619; --card: #172126; --surface: #1C272D; --screen: #121B1F; --ink: #EEF1F1; --sub: #A3ADB0; --mute: #6F7B80; --hair: #26323A;
  --teal: #5FB8B0; --teal-soft: #173533; --jul: #4A2A33; --jul-ink: #F4B8C6; --tom: #22344A; --tom-ink: #B5CDF0;
  --frame: #2B373D; --chip: #25323A; --glass: rgba(28, 39, 45, .72); --dark: #070B0D; --on-dark: #EEF1F1; --on-dark-sub: #8E999D;
  --orb-a: #3E9C95; --orb-b: #EEF1F1; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }

.brand img { width: 24px; height: 24px }
.nav .acts { display: flex; gap: 6px }

.nb { height: 34px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; text-decoration: none; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair) }

.scrolly { position: relative }
.sticky { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden }

.cta-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 26px }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: 999px; font: 600 15px/1 var(--f-body); text-decoration: none; border: 0; cursor: pointer; transition: transform .16s var(--ease-enter) }
.btn:active { transform: scale(.97) }
.btn-primary { background: var(--ink); color: var(--bg) }
.btn-ghost { background: var(--card); color: var(--ink) }

.ph { position: absolute; left: 0; top: 0; width: 320px; height: 656px; transform-origin: 0 0; will-change: transform; border-radius: 50px; background: var(--frame); padding: 9px; box-shadow: 0 40px 80px -36px rgba(22,35,42,.5) }
.ph .screen { position: relative; width: 100%; height: 100%; border-radius: 41px; overflow: hidden; background: var(--screen); isolation: isolate }

.scr.shot img { display: block; width: 100%; height: auto }

.scr { position: absolute; inset: 0; background: var(--screen); display: flex; flex-direction: column; will-change: transform; transform-origin: 50% 0 }
.scr.stacked { border-radius: 30px 30px 0 0; box-shadow: 0 -10px 30px rgba(10,10,10,.12); transform: translateY(100%) }
.status { display: flex; justify-content: space-between; padding: 14px 26px 0; font: 600 13px/1 var(--f-body); flex-shrink: 0 }
.s-head { padding: 24px 16px 8px; display: flex; flex-direction: column; gap: 12px }
.s-title { font-size: 25px; font-weight: 600; letter-spacing: -.5px; line-height: 1.1 }
.s-sub { font-size: 13px; color: var(--sub); margin-top: -8px }
.week { display: flex; justify-content: space-between }
.week span { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--sub); width: 13% }
.week b { width: 27px; height: 27px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font: 600 13px/1 var(--f-body); color: var(--ink) }
.week .on b { background: var(--ink); color: var(--screen) }
.week i { width: 4px; height: 4px; border-radius: 999px }

.days { flex: 1; overflow: hidden; padding: 4px 10px 0; display: flex; flex-direction: column; gap: 9px; -webkit-mask-image: linear-gradient(#000 80%, transparent); mask-image: linear-gradient(#000 80%, transparent) }
.day { background: var(--surface); border-radius: 22px; padding: 11px 11px 5px; display: flex; flex-direction: column }
.day h3 { margin: 0 0 3px 4px; font-size: 13px; font-weight: 600; color: var(--sub) }
.day h3 b { color: var(--ink) }
.row { display: flex; align-items: center; gap: 9px; padding: 5px 2px; overflow: hidden }
.tile { width: 38px; height: 38px; border-radius: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0 }
.tile img { width: 30px; height: 30px }
.tx { flex: 1; min-width: 0; display: flex; flex-direction: column }
.tx b { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

.who { width: 25px; height: 25px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; flex-shrink: 0 }
.who.j { background: var(--jul); color: var(--jul-ink) }
.who.t { background: var(--tom); color: var(--tom-ink) }
.nested { margin: -2px 0 4px 85px; font-size: 12px; color: var(--sub); display: flex; gap: 5px; flex-wrap: wrap }
.nested span { background: var(--chip); border-radius: 999px; padding: 2px 8px }

.think { display: flex; flex-direction: column; gap: 6px; padding: 6px 4px 8px }
.step { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--sub); opacity: 0; transform: translateY(6px); transition: opacity .28s var(--ease-enter), transform .28s var(--ease-enter) }
.step.in { opacity: 1; transform: none }
.c { width: 16px; height: 16px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--mute); flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; transition: background .2s, box-shadow .2s }
.c svg { opacity: 0; transition: opacity .2s }
.step.ok .c, .c.ok { background: var(--teal); box-shadow: none }
.step.ok .c svg, .c.ok svg { opacity: 1 }
.slot { height: 0; overflow: hidden; transition: height .42s var(--ease-move) }
.row.fresh { animation: land .55s var(--ease-enter) both }
.row.fresh .tile { animation: pop .7s var(--ease-enter) .1s both }
@keyframes land { from { opacity: 0; transform: translateY(-14px) scale(.98) } to { opacity: 1; transform: none } }
@keyframes pop { 0% { transform: scale(.6) } 60% { transform: scale(1.08) } 100% { transform: scale(1) } }
.row.flash { border-radius: 13px; animation: flash 1.6s ease-out .2s both }
@keyframes flash { 0% { background: var(--teal-soft) } 100% { background: transparent } }
.dock { position: absolute; left: 11px; right: 11px; bottom: 14px; display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 15px; border-radius: 999px; background: var(--surface); box-shadow: 0 0 0 1px rgba(10,10,10,.06), 0 8px 24px rgba(10,10,10,.08) }
.say { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.say.phd { color: var(--mute) }
.caret { display: inline-block; width: 1.5px; height: 1em; background: var(--teal); vertical-align: -2px; margin-left: 1px; animation: blink 1s steps(1) infinite }
@keyframes blink { 50% { opacity: 0 } }
.cam { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--sub) }
.orb { width: 40px; height: 40px; border-radius: 999px; background: radial-gradient(circle at 35% 30%, var(--orb-a), var(--orb-b)); flex-shrink: 0; display: flex; align-items: center; justify-content: center; position: relative }
.orb::after { content: ""; position: absolute; inset: -5px; border-radius: 999px; box-shadow: 0 0 0 2px var(--teal); opacity: 0 }

@keyframes ring { 0% { opacity: .6; transform: scale(.9) } 100% { opacity: 0; transform: scale(1.25) } }
.bars { display: flex; gap: 2.5px; align-items: center; height: 16px }

.box { background: var(--surface); border-radius: 20px; padding: 4px 12px }

.kv .v { flex: 1; min-width: 0 }

.chips { display: flex; gap: 5px; flex-wrap: wrap }
.chips span { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: 12px }
.asst { font-size: 11.5px; color: var(--teal); font-weight: 600; padding: 2px 4px 0 }
.src { display: flex; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--hair); font-size: 12.5px; align-items: flex-start }
.src:last-child { border-bottom: 0 }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 0 12px; text-align: center; font-size: 12px }
.cal .h { color: var(--mute); font-size: 10.5px; padding-bottom: 4px }
.cal span { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0 }
.cal span.o { color: var(--mute) }

.card { position: absolute; left: 0; top: 0; border-radius: 26px; background: var(--card); overflow: hidden; will-change: transform }

<div class="darkband" id="liste">
  <div class="in">
    <div>
      <h2 data-i18n="wlH"></h2>

      <form class="wl" id="wl"><label for="mail" class="sr" data-i18n="mail">E‑Mail</label><input id="mail" type="email" required data-i18n-ph="ph" autocomplete="email"><button type="submit" data-i18n="submit"></button></form>

      <div><b data-i18n="t3"></b><span data-i18n="t3s"></span></div>

</div>

<script>
const IMG = {{imgmap}};
const CHK = '{{chkraw}}';
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Hell/Dunkel: Standard hell, Wahl wird pro Browser gemerkt
function setMode(m) { document.documentElement.dataset.mode = m; $('mode').setAttribute('aria-pressed', m === 'dark'); $('mode').setAttribute('aria-label', T[lang][m === 'dark' ? 'light' : 'dark']); try { localStorage.setItem('famcal-mode', m) } catch (e) {} }

// Sprache: Deutsch und Englisch, Standard aus dem Browser, Wahl wird gemerkt
const T = {
  de: {
    nav: 'Hauptnavigation', navProto: 'Prototyp', navList: 'Warteliste', other: 'English', dark: 'Dunkler Modus', light: 'Heller Modus',
    h1: 'Einmal sagen. Beide wissen’s.',
    lede: 'Sprich, tipp oder fotografier, was ansteht. FamCal erkennt, ob es ein Termin oder etwas für die Einkaufsliste ist, und legt es an die richtige Stelle. Bei euch beiden, sofort.',
    cta1: 'Auf die Warteliste', cta2: 'Prototyp ansehen',
    phone: 'Echte Screens aus dem FamCal Prototyp: Tagesansicht, ein gesprochener Satz wird eingetragen, Termindetails, Woche nach Personen.',
    wlH: 'Bald zu zweit ausprobieren.', wlP: 'Tragt euch ein, dann melden wir uns, sobald ihr FamCal gemeinsam testen könnt.',
    mail: 'E‑Mail', ph: 'eure@mail.de', submit: 'Eintragen', note: 'Vorschau: Das Formular speichert noch nichts.', thanks: 'Danke! In dieser Vorschau wird noch nichts gespeichert.',
    t1: 'In eurer Sprache', t1s: 'Deutsch und Englisch ab dem ersten Tag. Versteht „übermorgen“ und „halb drei“.',
    t2: 'Keine Werbung', t2s: 'Eure Termine gehören euch und werden nicht vermarktet.',
    t3: 'Alle gleichberechtigt', t3s: 'Niemand ist Admin, alle sehen und ändern alles.',
    f1: 'FamCal · Arbeitsname · Köln', f2: 'Einmal sagen. Beide wissen’s.',
    feats: [
      { h: "Ein Satz, alles an seinem Platz.", p: "„Milch und Windeln, und Mia hat Donnerstag um drei Zahnarzt.“ FamCal teilt den Satz auf: zwei Sachen auf die Einkaufsliste, ein Termin in den richtigen Tag. Kein Formular, kein Sortieren.",
        f: [["Sprechen, tippen, fotografieren", "Eine Zeile unten auf jedem Screen, auch für Kita Zettel und Einladungen."], ["Mitdenken am Ort", "Die Schritte erscheinen dort, wo der Termin entsteht, und haken sich ab."], ["Alles bleibt bearbeitbar", "Antippen, und die Zeile wird zum Textfeld."]] },
      { h: "Er kennt euren Alltag.", p: "FamCal merkt sich, was ihr einmal gesagt habt, und ergänzt, was bei euch vor Ort gilt. Alles, was er selbst ergänzt, ist markiert und hat eine Quelle.",
        f: [["Orte vom letzten Mal", "Praxis, Büro, Verein oder Oma müsst ihr nur einmal nennen."], ["Was bei euch gilt", "Feiertage, Schulferien und Öffnungszeiten."], ["Immer mit Quelle", "Jede Ergänzung zeigt, woher sie kommt."]] },
      { h: "Beide wissen es, sofort.", p: "Sie spricht im Büro die Einkaufsliste ein, er steht im Supermarkt und hat sie schon. Niemand muss weiterleiten, erinnern oder den Sekretär spielen.",
        f: [["Wer, ohne zuzuweisen", "„Tom holt Mia ab“ landet bei Tom."], ["Leise statt laut", "Keine Werbung, keine Streaks. Nur Fristen melden sich."], ["Vorlagen für jede Phase", "Baby, Schulstart, Umzug oder Urlaub, fertig zum Loslegen."]] }
    ]
  },
  en: {
    nav: 'Main navigation', navProto: 'Prototype', navList: 'Waitlist', other: 'Deutsch', dark: 'Dark mode', light: 'Light mode',
    h1: 'Say it once. You both know.',
    lede: 'Say, type or snap what’s coming up. FamCal knows whether it’s an appointment or something for the shopping list and puts it in the right place. For both of you, instantly.',
    cta1: 'Join the waitlist', cta2: 'See the prototype',
    phone: 'Real screens from the FamCal prototype, in German: day view, a spoken sentence being added, event details, week by person.',
    wlH: 'Try it as a pair soon.', wlP: 'Sign up and we will let you know as soon as you can test FamCal together.',
    mail: 'Email', ph: 'you@email.com', submit: 'Sign up', note: 'Preview: the form does not save anything yet.', thanks: 'Thanks! Nothing is saved in this preview yet.',
    t1: 'In your language', t1s: 'English and German from day one. Gets “day after tomorrow” and “half past two”.',
    t2: 'No ads', t2s: 'Your events belong to you and are never sold.',
    t3: 'Everyone equal', t3s: 'No admins. Everyone sees and edits everything.',
    f1: 'FamCal · working name · Cologne', f2: 'Say it once. You both know.',
    feats: [
      { h: "One sentence, everything in its place.", p: "“Milk and nappies, and Mia has the dentist Thursday at three.” FamCal splits it up: two things on the shopping list, one appointment on the right day. No forms, no sorting.",
        f: [["Speak, type or snap a photo", "One line at the bottom of every screen, even for school letters and invitations."], ["Thinks along in place", "The steps show up right where the event is created and tick themselves off."], ["Everything stays editable", "Tap a line and it turns into a text field."]] },
      { h: "It knows your routine.", p: "FamCal remembers what you told it once and adds what applies where you live. Everything it adds on its own is marked and has a source.",
        f: [["Places from last time", "Name the doctor, the office, the club or grandma just once."], ["What applies locally", "Public holidays, school breaks and opening hours."], ["Always with a source", "Every addition shows where it came from."]] },
      { h: "You both know, instantly.", p: "She adds the shopping at work, he is in the supermarket and already has it. Nobody forwards, reminds or plays secretary.",
        f: [["Who, without assigning", "“Tom picks up Mia” lands with Tom."], ["Quiet, not loud", "No ads, no streaks. Only deadlines speak up."], ["Templates for every phase", "New baby, first school day, moving or holidays, ready to go."]] }
    ]
  }
};
let lang = 'de';
try { lang = localStorage.getItem('famcal-lang') || ((navigator.language || 'de').toLowerCase().startsWith('de') ? 'de' : 'en') } catch (e) {}
if (!T[lang]) lang = 'de';
let FEATS = T[lang].feats;
const featsHTML = f => f.map(([b, s]) => `<div class="feat"><b>${b}</b><span>${s}</span></div>`).join('');
function setLang(l) {
  lang = l; FEATS = T[l].feats; const t = T[l];
  document.documentElement.lang = l;
  document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t[n.dataset.i18n] });
  document.querySelectorAll('[data-i18n-aria]').forEach(n => n.setAttribute('aria-label', t[n.dataset.i18nAria]));
  document.querySelectorAll('[data-i18n-ph]').forEach(n => { n.placeholder = t[n.dataset.i18nPh] });
  const other = l === 'de' ? 'en' : 'de';
  $('lang').textContent = other.toUpperCase(); $('lang').lang = other; $('lang').setAttribute('aria-label', t.other);
  $('mode').setAttribute('aria-label', t[document.documentElement.dataset.mode === 'dark' ? 'light' : 'dark']);
  $('innerL').innerHTML = FEATS.map((x, i) => `<div class="blk"><span class="num">${i + 1} / 3</span><h2>${x.h}</h2><p>${x.p}</p></div>`).join('');
  $('innerR').innerHTML = FEATS.map(x => `<div class="blk">${featsHTML(x.f)}</div>`).join('');
  $('srFeat').innerHTML = FEATS.map(x => `<h2>${x.h}</h2><p>${x.p}</p><ul>${x.f.map(([b, s]) => `<li>${b}: ${s}</li>`).join('')}</ul>`).join('');
}
setLang(lang);
let savedMode = 'light'; try { savedMode = localStorage.getItem('famcal-mode') || 'light' } catch (e) {}
setMode(savedMode);
$('mode').addEventListener('click', () => setMode(document.documentElement.dataset.mode === 'dark' ? 'light' : 'dark'));

// Choreografie am Scroll: Telefon steht, Screens schieben sich übereinander
const PW = 320, PH = 656;
const main = $('mainPhone'), sides = [...document.querySelectorAll('.ph.side')], scr = [...document.querySelectorAll('#mainScreen .scr')];
const heroText = $('heroText'), cardL = $('cardL'), cardR = $('cardR'), innerL = $('innerL'), innerR = $('innerR');
let M = {}, isStatic = false;
const place = (el, x, y, s) => { el.style.transform = `translate(${x}px, ${y}px) scale(${s})` };

function measure() {
  const W = document.documentElement.clientWidth, H = innerHeight;
  isStatic = H < 480 || W < 300 || reduce;
  const narrow = W < 1024;
  document.body.classList.toggle('static', isStatic);
  document.body.classList.toggle('narrow', narrow && !isStatic);
  const heroBottom = heroText.offsetTop + heroText.offsetHeight;
  if (isStatic) {
    const sH = Math.min(.9, (W * .64) / PW);
    M = { W, H, sH, heroTop: heroBottom + 36 };
    document.body.style.setProperty('--static-h', Math.round(M.heroTop + PH * sH * .72) + 'px');
    $('scrolly').style.height = '';
    buildMobile(); frame(0); return;
  }
  const L = H * .9, p1 = H * .85;
  if (narrow) {
    // Handy: Telefon oben fest, eine Textkarte darunter
    const top = document.querySelector('.nav').getBoundingClientRect().bottom + 12, cardMin = 190;
    const sF = Math.min(.66, (H - top - 30 - cardMin) / PH, (W - 96) / PW), sH = Math.min(.9, (W * .64) / PW);
    const cardY = top + PH * sF + 14, cardW = W - 32, cardH = H - cardY - 16;
    M = { W, H, sF, sH, cardW, cardH, cardY, L, p1, narrow, heroTop: heroBottom + 30, cy: top };
  } else {
    const sF = Math.min(1, (H - 150) / PH), sH = sF * 1.08;
    const cardW = Math.min(380, (W - PW * sF) / 2 - 60), cardH = PH * sF;
    M = { W, H, sF, sH, cardW, cardH, L, p1, narrow, heroTop: heroBottom + 44, cy: (H - PH * sF) / 2 + 28 };
  }
  const { cardW, cardH } = M;
  M.k = narrow ? cardH / L : 1;
  [innerL, innerR].forEach(inn => [...inn.children].forEach(b => { b.style.height = L * M.k + 'px' }));
  [cardL, cardR].forEach(c => { c.style.width = cardW + 'px'; c.style.height = cardH + 'px' });
  $('scrolly').style.height = (H + p1 + 2.35 * L) + 'px';
  frame(scrollProgress());
}
function scrollProgress() { return isStatic ? 0 : Math.max(0, -$('scrolly').getBoundingClientRect().top) }

function sidePos(el, sH, gap) {
  const k = +el.dataset.pos, a = Math.abs(k), sc = sH * (a === 1 ? .86 : .74);
  const dx = a === 1 ? PW * sH * .5 + PW * sc * .5 + gap : PW * sH * .5 + PW * sH * .86 + PW * sc * .5 + gap * 2;
  return { k, a, sc, x: M.W / 2 + Math.sign(k) * dx - PW * sc / 2 };
}
function frame(s) {
  const { W, H } = M, cx = W / 2;
  if (isStatic) {
    const sH = M.sH;
    place(main, cx - PW * sH / 2, M.heroTop, sH);
    sides.forEach(el => { const p = sidePos(el, sH, 14); place(el, p.x, M.heroTop + (p.a === 1 ? 40 : 100) * sH, p.sc) });
    scr.forEach((e, i) => { e.style.transform = i ? 'translateY(100%)' : ''; e.style.filter = '' });
    heroText.style.transform = ''; heroText.style.opacity = '';
    return;
  }
  const { sF, sH, p1, L, cardW, cardH, cy } = M;
  const e = ease(clamp(s / p1));
  heroText.style.transform = `translateY(${-s * .9}px)`;
  heroText.style.opacity = clamp(1 - s / (H * .42));
  const sc = lerp(sH, sF, e), y = lerp(M.heroTop, cy, e);
  place(main, cx - PW * sc / 2, y, sc);
  sides.forEach(el => { const p = sidePos(el, sH, 22); place(el, p.x, M.heroTop + (p.a === 1 ? 46 : 120) * sH - s * (p.a === 1 ? 1.9 : 1.5), p.sc) });
  const ec = ease(clamp((s - p1 * .3) / (p1 * .7)));
  if (M.narrow) {
    place(cardL, 16, M.cardY + (1 - ec) * (H - M.cardY + 40), 1);
  } else {
    const off = (1 - ec) * (H - cy + 40);
    place(cardL, cx - PW * sF / 2 - 24 - cardW, cy + off, 1);
    place(cardR, cx + PW * sF / 2 + 24, cy + off * 1.15, 1);
  }
  const t = s - p1;
  innerL.style.transform = `translateY(${cardH / 2 - L * M.k / 2 - t * M.k}px)`;
  innerR.style.transform = `translateY(${cardH / 2 - L / 2 - t * 1.08 + 24}px)`;
  const pr = i => i < scr.length ? clamp((t - ((i - 1) * L - .6 * L)) / (.5 * L)) : 0;
  scr.forEach((el, i) => {
    const mine = i ? pr(i) : 1, next = pr(i + 1);
    el.style.transform = mine < 1 ? `translateY(${(1 - mine) * 100}%)` : `scale(${1 - .06 * next})`;
    el.style.filter = next ? `brightness(${1 - .14 * next})` : '';
  });
}
let raf = 0;
addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; if (!isStatic) frame(scrollProgress()) }) }, { passive: true });
// Auf dem Handy ändert die Adressleiste die Höhe beim Scrollen; nur bei echten Größenwechseln neu messen
let lastW = 0, lastH = 0;
addEventListener('resize', () => { const W = document.documentElement.clientWidth, H = innerHeight; if (W !== lastW || Math.abs(H - lastH) > 160) { lastW = W; lastH = H; measure() } });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

// Schmale Bildschirme: jeder Abschnitt mit eigenem Telefon
let built = false;
function buildMobile() {
  if (built) return; built = true;
  $('mfeat').innerHTML = FEATS.map((x, i) => `<article><h2>${x.h}</h2><p>${x.p}</p><div class="phw" data-i="${i}"></div><div class="feats">${featsHTML(x.f)}</div></article>`).join('');
  const k = Math.min(.82, (document.documentElement.clientWidth - 40) / PW);
  document.querySelectorAll('.mfeat .phw').forEach(w => {
    const i = +w.dataset.i;
    w.style.width = PW * k + 'px'; w.style.height = PH * k * .82 + 'px';
    const ph = document.createElement('div'); ph.className = 'ph';
    ph.innerHTML = `<div class="screen"><span class="island"></span></div>`;
    const c = scr[i + 1].cloneNode(true); c.style.transform = 'none'; c.style.filter = ''; c.classList.remove('stacked');
    c.querySelectorAll('[data-say],[data-orb],[data-slot],[data-empty],[data-dot]').forEach(n => ['data-say', 'data-orb', 'data-slot', 'data-empty', 'data-dot'].forEach(a => n.removeAttribute(a)));
    ph.querySelector('.screen').appendChild(c);
    ph.style.transform = `scale(${k})`;
    w.appendChild(ph);
  });
}

lastW = document.documentElement.clientWidth; lastH = innerHeight;
measure();

$('lang').addEventListener('click', () => { const l = lang === 'de' ? 'en' : 'de'; setLang(l); try { localStorage.setItem('famcal-lang', l) } catch (e) {} measure() });

$('wl').addEventListener('submit', e => { e.preventDefault(); $('wlnote').textContent = T[lang].thanks });
</script>
